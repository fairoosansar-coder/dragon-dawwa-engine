[supervisord]
nodaemon=true
logfile=/var/lib/ummah-humhub/runtime/supervisord.log
pidfile=/tmp/ummah-humhub-supervisord.pid
childlogdir=/var/lib/ummah-humhub/runtime

[program:apache]
command=/usr/local/bin/apache2-foreground
priority=20
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:humhub-queue]
command=php yii queue/listen 3 --isolate=1 --verbose=0 --interactive=0
directory=/var/www/html/protected
user=www-data
priority=30
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/lib/ummah-humhub/runtime/queue.stdout.log
stdout_logfile_maxbytes=1MB
stderr_logfile=/var/lib/ummah-humhub/runtime/queue.stderr.log
stderr_logfile_maxbytes=1MB

[program:humhub-cron]
command=/usr/local/bin/ummah-humhub-cron
directory=/var/www/html/protected
user=www-data
priority=30
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/lib/ummah-humhub/runtime/cron.stdout.log
stdout_logfile_maxbytes=1MB
stderr_logfile=/var/lib/ummah-humhub/runtime/cron.stderr.log
stderr_logfile_maxbytes=1MB
