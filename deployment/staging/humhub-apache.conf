<Directory /var/www/html>
  Options -Indexes +FollowSymLinks
  AllowOverride All
  Require all granted
  RewriteEngine On
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule . index.php [L]
</Directory>
<Directory /var/www/html/protected>
  Require all denied
</Directory>
<Directory /var/www/html/uploads/file>
  Require all denied
</Directory>
<FilesMatch "^(\\.env|composer\\.(json|lock)|package(-lock)?\\.json|module\\.json)$">
  Require all denied
</FilesMatch>
